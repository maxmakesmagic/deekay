name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      released: ${{ steps.semantic-release.outputs.released }}
      version: ${{ steps.semantic-release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test release tooling
        run: npm test
      - name: Lint extension
        run: npm run lint
      - name: Release
        id: semantic-release
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-chrome:
    name: Publish extension to Chrome
    needs: release
    if: needs.release.outputs.released == 'true'
    uses: ./.github/workflows/publish.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets:
      EXTENSION_ID: ${{ secrets.EXTENSION_ID }}
      PUBLISHER_ID: ${{ secrets.PUBLISHER_ID }}
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
      REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}

  publish-firefox:
    name: Publish extension to Firefox
    needs: release
    if: needs.release.outputs.released == 'true'
    uses: ./.github/workflows/publish-firefox.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets:
      MOZILLA_ISSUER: ${{ secrets.MOZILLA_ISSUER }}
      MOZILLA_SECRET: ${{ secrets.MOZILLA_SECRET }}
