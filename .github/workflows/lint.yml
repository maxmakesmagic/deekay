name: "Lint"
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v6
      - name: "Set up Node.js"
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: "web-ext lint"
        run: npx --yes web-ext@10.6.0 lint
